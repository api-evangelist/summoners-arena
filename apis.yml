description: 'Summoners Arena is a blockchain-based, multi-genre play-to-earn game
  universe set in the antique lore of Summonia, where players summon, evolve, and battle
  NFT heroes across PvP modes (Arena, Battleground) and PvE content (Dungeon, Campaign),
  with an in-game NFT marketplace supporting hero renting, equipment collection, and
  forging. Backed by Pantera Capital, it operates in the Web3 / crypto gaming sector.
